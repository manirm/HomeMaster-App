<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/HomeMaster-App/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="HomeMaster: Professional Home & Maintenance Suite">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HomeMaster">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)">
  <title>HomeMaster</title>
  <link rel="manifest" href="manifest.json?v=1.4.5">
  <script>
    window.__homeMasterDeferredPrompt = null;

    function isStandaloneDisplay() {
      return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true
      );
    }

    function showNativeInstallBar() {
      if (isStandaloneDisplay()) return;
      try {
        if (sessionStorage.getItem("hm_native_install_hidden") === "1") return;
      } catch (_) {}
      var bar = document.getElementById("hmNativeInstallBar");
      if (bar) {
        bar.style.display = "flex";
      }
    }

    function hideNativeInstallBar() {
      var bar = document.getElementById("hmNativeInstallBar");
      if (bar) {
        bar.style.display = "none";
      }
    }

    window.__homeMasterTriggerInstall = async function () {
      try {
        var promptEvent = window.__homeMasterDeferredPrompt;
        if (!promptEvent || typeof promptEvent.prompt !== "function") {
          return false;
        }
        await promptEvent.prompt();
        var choice = await promptEvent.userChoice;
        window.__homeMasterDeferredPrompt = null;
        if (choice && choice.outcome === "accepted") {
          hideNativeInstallBar();
          return true;
        }
        return false;
      } catch (_) {
        return false;
      }
    };

    window.__homeMasterForceRefresh = async function () {
      try {
        if ("caches" in window) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
        if ("serviceWorker" in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
      } catch (_) {}
      var url = new URL(window.location.href);
      url.searchParams.set("refresh", String(Date.now()));
      window.location.replace(url.toString());
    };

    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.__homeMasterDeferredPrompt = e;
      showNativeInstallBar();
    });

    window.addEventListener("appinstalled", function () {
      window.__homeMasterDeferredPrompt = null;
      hideNativeInstallBar();
    });

    window.addEventListener("DOMContentLoaded", function () {
      if (window.__homeMasterDeferredPrompt) {
        showNativeInstallBar();
      }
    });

    if ("caches" in window) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) {
          if (k.indexOf("flutter-app-") === 0 || k.indexOf("flutter-temp-") === 0) {
            caches.delete(k).catch(function () {});
          }
        });
      }).catch(function () {});
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js?v=1.4.5").then(function (reg) {
        if (reg && typeof reg.update === "function") {
          reg.update().catch(function () {});
        }
      }).catch(function () {});
    }
  </script>
  <style>
    html, body {
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #090d16;
        color: #f1f5f9;
      }
    }
    #hmNativeInstallBar {
      display: none;
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 9999;
      align-items: center;
      gap: 8px;
      padding: 6px 8px 6px 12px;
      border-radius: 9999px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid rgba(245, 158, 11, 0.45);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    #hmNativeInstallBtn {
      appearance: none;
      border: none;
      background: #d97706;
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 9999px;
      cursor: pointer;
      min-height: 36px;
    }
    #hmNativeInstallClose {
      appearance: none;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 16px;
      line-height: 1;
      padding: 6px 8px;
      cursor: pointer;
      min-width: 32px;
      min-height: 32px;
    }
    @media print {
      #hmNativeInstallBar {
        display: none !important;
      }
      body {
        background: #ffffff !important;
        color: #0f172a !important;
      }
      flt-glass-pane, button, [role="button"] {
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="hmNativeInstallBar" role="region" aria-label="Install HomeMaster app">
    <button id="hmNativeInstallBtn" type="button">Install App</button>
    <button id="hmNativeInstallClose" type="button" aria-label="Dismiss install button">&times;</button>
  </div>
  <script>
    (function () {
      var installBtn = document.getElementById("hmNativeInstallBtn");
      var closeBtn = document.getElementById("hmNativeInstallClose");
      if (installBtn) {
        installBtn.addEventListener("click", function () {
          if (typeof window.__homeMasterTriggerInstall === "function") {
            window.__homeMasterTriggerInstall();
          }
        });
      }
      if (closeBtn) {
        closeBtn.addEventListener("click", function () {
          try {
            sessionStorage.setItem("hm_native_install_hidden", "1");
          } catch (_) {}
          hideNativeInstallBar();
        });
      }
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script type="module" src="webllm_bridge.js?v=1.4.5"></script>
  <script src="flutter_bootstrap.js?v=1.4.5" async></script>
</body>
</html>
